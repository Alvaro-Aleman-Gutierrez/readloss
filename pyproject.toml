[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readloss"
version = "0.3.0"
description = "Test gene loss from raw genomic reads with single-copy paralog controls"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["scipy>=1.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
readloss = "readloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
